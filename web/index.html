<!DOCTYPE html>
<html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--cream:#FBF7F0;--ink:#1A1A1A;--red:#E8352E;--navy:#1A365D;--yellow:#FFF1B8;--grey:#555;--line:#1A1A1A;--pass:#2D7D46;--fail:#B03A2E;--accent:#C2410C}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--cream);color:var(--ink);line-height:1.6}
.wrap{display:flex;max-width:1200px;margin:0 auto;min-height:100vh}
.rail{width:236px;flex-shrink:0;padding:26px 14px;border-right:2px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto}
.rail h1{font-size:16px;margin-bottom:3px}.rail .tag{font-size:11px;color:var(--accent);font-weight:700;letter-spacing:1px;margin-bottom:16px;display:block}
.grp{font-size:11px;font-weight:800;letter-spacing:1px;color:var(--navy);margin:16px 0 6px;padding-left:4px}.grp.s{color:var(--accent)}
.node{display:flex;align-items:flex-start;gap:9px;padding:8px;border-radius:8px;cursor:pointer;margin-bottom:2px}
.node:hover{background:#fff}.node.active{background:var(--yellow)}
.dot{width:32px;height:30px;flex-shrink:0;border:2px solid var(--line);border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;box-shadow:2px 2px 0 var(--ink)}
.node.active .dot{background:var(--accent);color:#fff}.node.s.active .dot{background:var(--navy)}
.node .nt{font-size:13px;font-weight:700}.node .ns{font-size:10.5px;color:var(--grey)}
.gp{font-size:10px;font-weight:700;color:#aaa}.gp.full{color:var(--pass)}
.rail .foot{font-size:10.5px;color:var(--grey);margin-top:18px;padding:8px;border-top:1px dashed #bbb}
.main{flex:1;padding:32px 40px;max-width:944px}
.crumb{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:2px}
h2{font-size:26px;margin:4px 0 2px}.sub{color:var(--grey);font-size:15px;margin-bottom:18px}
.goal{background:var(--yellow);border:2px solid var(--line);box-shadow:4px 4px 0 var(--ink);padding:13px 18px;border-radius:10px;margin-bottom:20px;font-size:15px}
.sec{margin-bottom:20px}.sec h3{font-size:13px;color:var(--accent);letter-spacing:1px;margin-bottom:8px}
.idea{background:#fff;border:2px solid var(--line);border-left:8px solid var(--navy);border-radius:10px;padding:12px 18px;font-size:14px}.idea b{color:var(--navy)}
.steps{list-style:none;counter-reset:st}
.steps li{counter-increment:st;position:relative;padding:8px 0 8px 42px;font-size:14px;border-bottom:1px dashed #ddd}.steps li:last-child{border-bottom:none}
.steps li:before{content:counter(st);position:absolute;left:2px;top:8px;width:26px;height:26px;border:2px solid var(--line);border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;box-shadow:2px 2px 0 var(--ink)}
.steps li b{color:var(--accent)}.steps code{background:#f2efe8;padding:1px 5px;border-radius:4px;font-size:12.5px}
.chk{list-style:none}.chk li{padding:7px 0;cursor:pointer;font-size:14px}.chk li:before{content:"\2610 ";color:var(--accent);font-weight:700}
.chk li.done{color:#999;text-decoration:line-through}.chk li.done:before{content:"\2611 ";color:var(--pass)}
.think{background:#fff;border:2px dashed var(--accent);border-radius:10px;padding:13px 18px;font-size:14px}.think b{color:var(--accent)}
.nav{display:flex;justify-content:space-between;margin-top:28px;padding-top:16px;border-top:2px solid var(--line)}
.nav button{font-family:inherit;font-size:14px;font-weight:700;padding:10px 18px;border:2px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.nav button:active{box-shadow:0 0 0;transform:translate(3px,3px)}.nav button:disabled{opacity:.3;cursor:default;box-shadow:none}
.flow{display:flex;flex-wrap:wrap;gap:0;margin:6px 0 14px}
.fstep{flex:1;min-width:120px;border:2px solid var(--line);border-radius:10px;background:#fff;box-shadow:3px 3px 0 var(--ink);padding:11px 12px;position:relative;margin:0 16px 12px 0}
.fstep .l{font-size:15px;font-weight:800;color:var(--navy)}.fstep.acc .l{color:var(--accent)}.fstep .t{font-size:12px;color:#444}
.fstep:after{content:"\2192";position:absolute;right:-15px;top:34%;font-weight:800;color:var(--accent)}.fstep.last:after{content:""}
.adv{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin:6px 0 14px}
@media(max-width:720px){.adv{grid-template-columns:1fr}.wrap{flex-direction:column}.rail{width:100%;height:auto;position:static;border-right:none;border-bottom:2px solid var(--line)}}
.acard{border:2px solid var(--line);border-radius:10px;background:#fff;box-shadow:3px 3px 0 var(--ink);padding:12px 14px}.acard .h{font-size:15px;font-weight:800;color:var(--navy);margin-bottom:4px}.acard .b{font-size:12.5px;color:#444}
/* widgets */
.sim{background:#fff;border:2px solid var(--fail);border-radius:12px;padding:16px 18px;margin-top:6px}
.sim textarea{width:100%;min-height:80px;border:2px solid var(--line);border-radius:8px;padding:8px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;resize:vertical}
.sim button{font-family:inherit;font-size:13px;font-weight:700;border:2px solid var(--line);background:var(--navy);color:#fff;border-radius:8px;padding:8px 16px;margin-top:8px;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.sim .verdict{font-size:15px;font-weight:800;padding:8px 14px;border-radius:8px;display:inline-block;margin-top:10px}
.sim .verdict.pass{background:#E6F4EA;color:var(--pass);border:2px solid var(--pass)}.sim .verdict.fail{background:#FBECEA;color:var(--fail);border:2px solid var(--fail)}
.chooser{background:#fff;border:2px solid var(--navy);border-radius:12px;padding:16px 18px;margin-top:6px}
.chooser .q{font-size:14px;font-weight:700;margin-bottom:8px}
.chooser button{font-family:inherit;font-size:13px;font-weight:700;border:2px solid var(--line);background:#fff;border-radius:16px;padding:6px 14px;margin:0 8px 8px 0;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.chooser .rec{font-size:14px;margin-top:8px;padding:10px 12px;background:var(--yellow);border:2px solid var(--line);border-radius:8px;display:none}
</style></head>

function renderRail(){

 document.getElementById("railnodes").innerHTML=h;
}

function scanKey(){
 const t=document.getElementById("code").value;
 const hits=[];
 if(/sk-[A-Za-z0-9]{12,}/.test(t)||/sk-or-/.test(t)) hits.push("发现疑似 API key(sk-…)——绝不能在前端!");
 if(/openrouter\.ai|api\.openai\.com|api\.anthropic\.com/.test(t)) hits.push("前端直接 fetch 模型 API——应改成调你自己的后端 /api/chat");
 if(/Authorization|x-api-key|Bearer\s+sk/.test(t)) hits.push("前端出现 Authorization/key 头——密钥应留在后端");
 const v=document.getElementById("kv");
 if(!t.trim()){v.innerHTML="";return;}
 v.innerHTML = hits.length
   ? `<div class="verdict fail">✘ FAIL · ${hits.length} 处风险</div><ul style="margin:8px 0 0 18px;font-size:13px">${hits.map(h=>`<li>${h}</li>`).join("")}</ul>`
   : `<div class="verdict pass">✔ PASS · 没发现 key,也没直连模型</div>`;
}
function chooserHTML(){
 return `<div class="sec"><h3>🧭 部署选型助手</h3><div class="chooser">
 <div class="q">你的作品要不要<b>真的调模型对话</b>(而不只是展示界面)?</div>
 <button onclick="rec('static')">不用,只展示</button>
 <button onclick="rec('dyn')">要,真对话</button>
 <button onclick="rec('cn')">要,而且长期给国内用户用</button>
 <div class="rec" id="rec"></div></div></div>`;
}
function rec(k){
 const r=document.getElementById("rec"); r.style.display="block";
 if(k==="static") r.innerHTML="→ <b>静态</b>:前端放 <b>GitHub Pages</b>(免费)。不需要后端。";
 else if(k==="dyn") r.innerHTML="→ <b>动态</b>:前端 <b>GitHub Pages</b> + 后端 <b>Railway</b>(Python 友好,默认)。key 放 Railway Variables。零成本可换 Vercel。";
 else r.innerHTML="→ <b>动态 + 国内</b>:先用 Pages + Railway 跑通;长期给国内用户 → 后端迁 <b>腾讯云/阿里云</b>(需实名+少量费用),前端可套 Cloudflare。";
}
function navHTML(){return `<div class="nav"><button ${cur===0?'disabled':''} onclick="go(${cur-1})">← 上一步</button><button ${cur===ALL.length-1?'disabled':''} onclick="go(${cur+1})">下一步 →</button></div>`;}
function render(){
 const it=ALL[cur],main=document.getElementById("main");
 if(it.overview){main.innerHTML=overviewHTML()+navHTML();renderRail();return;}
 const s=it;
 let h=`<div class="crumb">${s.sub}</div><h2>${s.title}</h2>`;
 h+=`<div class="goal">🎯 ${s.goal}</div>`;
 h+=`<div class="sec"><h3>新想法</h3><div class="idea">${s.idea}</div></div>`;
 h+=`<div class="sec"><h3>操作步骤(指挥 Claude Code + 你验收)</h3><ol class="steps">${s.steps.map(x=>`<li>${x}</li>`).join("")}</ol></div>`;
 if(s.sim==="keyscan")h+=keyscanHTML();
 if(s.chooser)h+=chooserHTML();
 if(s.gate.length){const done=gates[s.id]||[];
  h+=`<div class="sec"><h3>门禁检查(过了才进下一步)</h3><ul class="chk" id="chk">${s.gate.map((g,i)=>`<li class="${done.includes(i)?'done':''}" data-i="${i}">${g}</li>`).join("")}</ul></div>`;}
 h+=`<div class="think">💭 <b>思考题:</b>${s.think}</div>`+navHTML();
 main.innerHTML=h;
 if(s.gate.length)document.querySelectorAll("#chk li").forEach(li=>li.onclick=()=>{
   const i=+li.dataset.i,arr=gates[s.id]||[],p=arr.indexOf(i);
   if(p>=0)arr.splice(p,1);else arr.push(i);gates[s.id]=arr;saveGates();li.classList.toggle("done");renderRail();});
 renderRail();
}
function go(i){cur=Math.max(0,Math.min(ALL.length-1,i));window.scrollTo(0,0);render();}
render();
</script>
</body></html>
