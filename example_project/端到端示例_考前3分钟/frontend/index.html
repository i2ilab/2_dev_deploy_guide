<!DOCTYPE html>
<html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>考前 3 分钟 · 小安</title>
<style>
  /* 纯静态单页,可直接放 GitHub Pages。★关键:这里没有、也绝不能有任何 key —— 只调后端。 */
  :root{--bg:#FBF7F0;--ink:#2B2B2B;--accent:#C2410C;--navy:#1A365D;--line:#E3E1DC;--me:#1A365D}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC",sans-serif;background:var(--bg);color:var(--ink);height:100vh;display:flex;flex-direction:column}
  header{padding:14px 18px;border-bottom:2px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  header h1{font-size:17px}header .sub{font-size:12px;color:#8A8A8A}
  #crisis{font-size:12px;font-weight:700;color:#fff;background:var(--accent);border:none;border-radius:16px;padding:6px 12px;cursor:pointer}
  #log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;max-width:720px;width:100%;margin:0 auto}
  .msg{max-width:80%;padding:10px 14px;border-radius:14px;font-size:15px;line-height:1.5;white-space:pre-wrap}
  .bot{background:#fff;border:1.5px solid var(--line);align-self:flex-start}
  .me{background:var(--me);color:#fff;align-self:flex-end}
  .sys{align-self:center;font-size:12px;color:#8A8A8A}
  form{display:flex;gap:8px;padding:14px;border-top:2px solid var(--line);max-width:720px;width:100%;margin:0 auto}
  input{flex:1;border:2px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;font-family:inherit}
  button.send{border:none;background:var(--navy);color:#fff;border-radius:10px;padding:10px 18px;font-weight:700;cursor:pointer}
  button:disabled{opacity:.5}
</style></head>
<body>
<header>
  <div><h1>考前 3 分钟 · 小安 🍃</h1><div class="sub">温和陪你稳住情绪 · 我是 AI,不能替代专业帮助</div></div>
  <button id="crisis">我需要紧急帮助</button>
</header>
<div id="log"></div>
<form id="f"><input id="inp" placeholder="现在有点紧张…和小安说说" autocomplete="off"><button class="send" id="send">发送</button></form>
<script>
// ★ 后端地址:本地开发用 localhost;上线后改成你的 Railway 域名(见 README)。
const BACKEND = (location.hostname === "localhost" || location.hostname === "127.0.0.1")
  ? "http://localhost:8000" : "https://your-app.up.railway.app";
const log = document.getElementById("log"), inp = document.getElementById("inp");
const f = document.getElementById("f"), send = document.getElementById("send");
const history = [];
function add(role, text){
  const d = document.createElement("div");
  d.className = "msg " + (role === "user" ? "me" : role === "sys" ? "sys" : "bot");
  d.textContent = text; log.appendChild(d); log.scrollTop = log.scrollHeight;
}
add("bot", "嗨,我是小安 🍃 考试前紧张是很正常的。要不要我陪你做一个 3 分钟的小练习?或者先跟我说说,你现在感觉怎么样?");
async function sendMsg(text){
  add("user", text); history.push({role:"user", content:text});
  inp.value = ""; send.disabled = true;
  try{
    const r = await fetch(BACKEND + "/api/chat", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({messages: history})
    });
    if(!r.ok) throw new Error("bad status");
    const data = await r.json();
    add("bot", data.reply); history.push({role:"assistant", content:data.reply});
    if(data.meta && data.meta.crisis) add("sys", "⚠ 已切换到危机支持模式,请务必联系上面的真人资源");
  }catch(e){
    // 优雅降级:后端连不上也不白屏,给一句兜底 + 求助资源
    add("sys", "（连接不上小安,可能是网络问题。深呼吸一下,过会儿再试;如有紧急情况请拨打 12356 或 120)");
  }finally{ send.disabled = false; inp.focus(); }
}
f.onsubmit = e => { e.preventDefault(); const t = inp.value.trim(); if(t) sendMsg(t); };
document.getElementById("crisis").onclick = () => sendMsg("我现在很难受,撑不下去了");
</script>
</body></html>
